<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Mom’s Call">
  <link rel="manifest" href="/mom.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <title>Video Drop In</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-room="__ROOM__">
<main>
  <h1 id="title">Video Drop In</h1>
  <p id="intro">Mom can join from her phone to talk back.</p>
  <p id="status" role="status" aria-live="polite">Loading…</p>

  <section id="caller" hidden>
    <div class="button-stack">
      <button id="shareMomLink" class="secondary">Text Mom a call link</button>
      <button id="startCall">Call Mom on the TV</button>
      <button id="hangup" class="danger" disabled>Hang up</button>
    </div>
    <div class="video-grid">
      <video id="preview" autoplay muted playsinline hidden></video>
      <video id="callerRemote" autoplay playsinline hidden></video>
    </div>
  </section>

  <section id="mom" hidden>
    <div class="video-grid">
      <video id="momRemote" autoplay playsinline hidden></video>
      <video id="momPreview" autoplay muted playsinline hidden></video>
    </div>
    <div class="button-stack mom-media-controls">
      <button id="momCamera" class="toggle" type="button" aria-pressed="false">Turn camera on</button>
      <button id="momMic" class="toggle" type="button" aria-pressed="false">Turn mic on</button>
    </div>
    <div id="momIncoming" class="incoming-card" hidden>
      <p class="incoming-title">Incoming call</p>
    </div>
    <div id="momActions" class="button-stack" hidden>
      <button id="momAnswer" type="button" hidden>Answer</button>
      <button id="momHangup" class="danger" type="button" hidden>Hang up</button>
    </div>
  </section>

  <section id="receiver" hidden>
    <button id="enterFullscreen" type="button">Preparing your call<span>One moment…</span></button>
    <button id="enableAudio" class="secondary" hidden>Enable sound</button>
    <video id="remote" autoplay playsinline></video>
    <p class="small">Receiver only. This TV page does not use a camera or microphone.</p>
  </section>
</main>
<script src="/app.js" defer></script>
</body>
</html>
